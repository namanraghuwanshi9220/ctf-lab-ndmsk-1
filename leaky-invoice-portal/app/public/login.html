<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | CorpNet</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="logo" style="text-align: center; margin-bottom: 20px;">🏢 CorpNet</div>
        <h2>Employee Sign In</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="loginUser" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Access Portal</button>
            <div id="authMsg" class="msg"></div>
        </form>
        <p class="auth-footer">Don't have an account? <a href="/register.html">Register here</a></p>
    </div>
    <script src="/app.js"></script>
</body>
</html>
