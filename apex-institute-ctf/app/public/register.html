<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Enrollment | Apex</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar"><div class="logo"><a href="/">🎓 Apex Institute</a></div></nav>
    <div class="container" style="max-width: 500px;">
        <div class="card">
            <h2>Student Enrollment</h2>
            <form id="regForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="e.g. Rahul Verma" required>
                </div>
                <div class="input-group">
                    <label>Course</label>
                    <select id="regCourse">
                        <option>Computer Science</option>
                        <option>Mechanical Engineering</option>
                        <option>Business Administration</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="regUser" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="regPass" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                <div id="authMsg" class="msg"></div>
            </form>
            <p style="text-align: center; margin-top: 15px;"><a href="/login.html" style="color: var(--accent); font-weight: bold;">Already enrolled? Login here</a></p>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
